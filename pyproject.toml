# Tool configuration only (the app itself is started by run.bat, not installed as a package).
[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["env", "models", "ollama", "tools", ".cache"]

[tool.ruff.lint]
# real errors (syntax, undefined names, unused imports) + bugbear (likely bugs)
select = ["E9", "F", "B"]
ignore = ["B905"]  # zip(strict=) is optional here

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["airflow: needs apache-airflow installed (CI job 'dags')"]
addopts = "-ra"
