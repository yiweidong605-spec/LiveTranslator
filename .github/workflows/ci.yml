# CI: every push and pull request is checked; green commits on main are promoted to the "deploy"
# branch, which the mini PC pulls every 5 minutes (infra/platform/deploy/deploy.sh).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff, shellcheck, compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - name: ruff (Python errors and likely bugs)
        run: ruff check --output-format=github .
      - name: shellcheck (all shell scripts)
        run: git ls-files '*.sh' | xargs shellcheck -S warning
      - name: docker compose config is valid
        working-directory: infra/platform
        # every key from .env.example with a dummy value (the real .env only exists on the mini PC)
        run: sed -E 's/^([A-Z0-9_]+)=$/\1=ci-dummy/' .env.example > .env && docker compose config --quiet

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # scan the whole history, not only the last commit
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: pip install -r requirements-ci.txt
      - run: pytest -m "not airflow"

  dags:
    name: DAG integrity (Airflow 3.4.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"   # same Python as the apache/airflow:3.4.0 image on the mini PC
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: pip install "apache-airflow==3.4.0" apache-airflow-providers-fab -r requirements-ci.txt
      - run: pytest -m airflow

  promote:
    name: Promote to deploy branch
    needs: [lint, secrets, unit, dags]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # only this job may write, and only to move the deploy branch
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Move "deploy" to this commit
        run: |
          git push --force origin "${GITHUB_SHA}:refs/heads/deploy"
          echo "### Promoted \`${GITHUB_SHA::8}\` to **deploy** — the mini PC applies it within ~5 min" >> "$GITHUB_STEP_SUMMARY"
